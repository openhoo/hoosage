name: Release
on:
  workflow_run:
    workflows: [Verify and package]
    branches: [main]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false
env:
  HOOVERSION_VERSION: 1.1.2
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main') ||
      (github.event_name == 'workflow_dispatch' && github.ref_name == 'main')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - name: Prepare protected-branch release
        if: github.event_name == 'workflow_dispatch' || !startsWith(github.event.workflow_run.head_commit.message, 'chore(release):')
        uses: openhoo/hooversion/actions/prepare-release@f0a37cca22997993ca6416010b81ca197a3ac580 # v1.1.2
        with:
          version: ${{ env.HOOVERSION_VERSION }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          install-command: npm ci --no-audit
      - name: Finalize protected-branch release
        id: finalize
        if: github.event_name == 'workflow_run' && startsWith(github.event.workflow_run.head_commit.message, 'chore(release):')
        uses: openhoo/hooversion/actions/release@f0a37cca22997993ca6416010b81ca197a3ac580 # v1.1.2
        with:
          version: ${{ env.HOOVERSION_VERSION }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          install-command: npm ci --no-audit
      - name: Upload vsix to GitHub release
        if: steps.finalize.outputs.published == 'true'
        run: |
          gh run download "$SOURCE_RUN_ID" --name hoosage-vsix --dir .
          gh release upload "$RELEASE_TAG" hoosage.vsix --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          RELEASE_TAG: ${{ steps.finalize.outputs.tag }}
